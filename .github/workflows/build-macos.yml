name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on macOS
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build app
        run: |
          pyinstaller \
            --windowed \
            --noconfirm \
            --name "Contract Generator" \
            --add-data "templates:templates" \
            --add-data "icon.png:." \
            app.py

      - name: Sign app bundle
        run: |
          codesign --force --deep --sign - "dist/Contract Generator.app"

      - name: Package app
        run: |
          cd dist
          zip -r "Contract-Generator-macOS.zip" "Contract Generator.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Contract-Generator-macOS
          path: dist/Contract-Generator-macOS.zip
